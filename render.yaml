databases:
  - name: skyims-db
    databaseName: skyims
    user: skyims
    plan: free
    region: singapore

services:
  - type: web
    name: skyims
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: SKYIMS
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        value: base64:m89zJoz5BRuQFwwkDj7CsUh4PBEj68ErwNXk/pV4Jic=
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: skyims-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: SMS_DRIVER
        value: log
